[package]
name = "hub-rs"
version = "0.1.0"
edition = "2021"
description = "AIndex Hub - Code Intelligence Platform Backend"
[[bin]]
name = "hub"
path = "src/main.rs"

[[bin]]
name = "mowen"
path = "src/main.rs"

[dependencies]
# HTTP framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SQLite (read codebase-memory-mcp graph DB)
rusqlite = { version = "0.32", features = ["bundled"] }

# Git operations
git2 = "0.20"

# HTTP client (LLM API calls)
reqwest = { version = "0.12", features = ["json", "stream"] }

# File traversal
walkdir = "2"
ignore = "0.4"

# Regex (token-killer source compression, ported from rtk)
regex = "1"

# rtk (Rust Token Killer) - source-compression engine linked as a library.
# The rtk binary is also invoked as a subprocess for command filtering + hooks.
rtk = { path = "rtk" }

# Hashing (must match codebase-memory-mcp XXH3 sparse random indexing)
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async agent backends: trait objects + concurrent detection + SSE streaming.
async-trait = "0.1"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

# API documentation
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Environment
dotenvy = "0.15"

# Error handling
anyhow = "1"
thiserror = "2"
tempfile = "3.27.0"
toml_edit = "0.25.13"
dirs = "6.0.0"
toml = "0.8"
petgraph = "0.8.3"
async-stream = "0.3.6"
bytes = "1.12.1"
clap = { version = "4", features = ["derive"] }
rustyline = "14"
sha2 = "0.11.0"
base64 = "0.23.1"
rand = "0.10.2"
open = "5.4.1"
urlencoding = "2.1.3"
dialoguer = "0.12.0"
keyring = "4.1.6"
machine-uid = "0.6.0"
windows-sys = { version = "0.61.2", features = ["Win32_Security_Credentials", "Win32_Foundation"] }
webbrowser = "1.2.4"

[profile.release]
opt-level = 3
lto = true
strip = true

[workspace]
members = ["rtk"]

